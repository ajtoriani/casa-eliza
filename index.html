<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo | Casa da Eliza</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        :root {
            --bg-body: #f7efe5;
            --bg-card: #ffffff;
            --primary: #bd7b4c;
            --primary-hover: #a66a3e;
            --secondary: #4a260f;
            --text-main: #43210f;
            --text-muted: #7c6659;
            --success: #2ecc71;
            --danger: #e74c3c;
            --warning: #f39c12;
            --border: #e8dccf;
            --radius: 16px;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Nunito', sans-serif; background: var(--bg-body); color: var(--text-main); padding-bottom: 50px; }
        
        .header { background: var(--secondary); color: white; padding: 20px; text-align: center; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
        .header-content { max-width: 800px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-family: 'Fredoka', sans-serif; font-size: 1.4rem; color: #f4e6d6; }
        .btn-logout { background: rgba(255,255,255,0.15); color: white; border: none; padding: 8px 14px; border-radius: 8px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 6px; font-size: 0.85rem; }
        .btn-logout:hover { background: var(--danger); }

        .container { max-width: 800px; margin: 20px auto; padding: 0 16px; }

        /* TELA LOGIN */
        .login-card { max-width: 400px; margin: 60px auto; background: white; padding: 30px; border-radius: var(--radius); box-shadow: var(--shadow); text-align: center; }
        .login-card h2 { font-family: 'Fredoka', sans-serif; color: var(--primary); margin-bottom: 8px; font-size: 1.6rem; }

        /* PAINEL PRINCIPAL */
        .dashboard-grid { display: grid; gap: 20px; }

        /* CARD STATUS DA LOJA */
        .card { background: white; border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); border: 1px solid var(--border); }
        .card-title { font-family: 'Fredoka', sans-serif; font-size: 1.2rem; margin-bottom: 15px; color: var(--secondary); display: flex; align-items: center; gap: 8px; }

        .store-status-options { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px; }
        .status-btn { padding: 12px 8px; border: 2px solid var(--border); background: white; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 0.85rem; color: var(--text-muted); transition: 0.2s; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .status-btn.active-open { background: #e8f8f0; border-color: var(--success); color: #1e8449; }
        .status-btn.active-closed { background: #fdeaea; border-color: var(--danger); color: #922b21; }
        .status-btn.active-auto { background: #fef5e7; border-color: var(--warning); color: #b9770e; }

        /* FORMULÁRIOS & INPUTS */
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 10px; font-family: inherit; font-size: 0.95rem; margin-bottom: 12px; outline: none; background: #fffaf4; }
        input:focus, select:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(189, 123, 76, 0.15); }
        label { font-size: 0.85rem; font-weight: 700; color: var(--text-muted); display: block; margin-bottom: 4px; }

        .btn-primary { width: 100%; background: var(--primary); color: white; border: none; padding: 14px; border-radius: 10px; font-weight: bold; font-size: 1rem; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-primary:hover { background: var(--primary-hover); }

        /* NAV NAVEGAÇÃO */
        .nav-tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid var(--border); padding-bottom: 10px; }
        .tab-btn { background: transparent; border: none; font-size: 1rem; font-weight: 700; color: var(--text-muted); padding: 8px 16px; border-radius: 8px; cursor: pointer; }
        .tab-btn.active { background: var(--secondary); color: white; }

        /* LISTA DE PRODUTOS */
        .product-item { display: flex; align-items: center; gap: 14px; padding: 12px; border-bottom: 1px solid var(--border); transition: 0.2s; }
        .product-item:last-child { border-bottom: none; }
        .product-thumb { width: 60px; height: 60px; border-radius: 10px; object-fit: cover; background: #f0e2d2; flex-shrink: 0; }
        .product-details { flex: 1; }
        .product-details h4 { font-size: 1rem; color: var(--text-main); }
        .product-details .type-badge { font-size: 0.75rem; background: #f4e6d6; color: var(--secondary); padding: 2px 8px; border-radius: 6px; font-weight: 700; display: inline-block; margin-top: 2px; }

        .stock-control { display: flex; align-items: center; gap: 6px; }
        .stock-btn { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--border); background: white; color: var(--text-main); font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .stock-btn:hover { background: var(--primary); color: white; border-color: var(--primary); }
        .stock-value { font-weight: 800; font-size: 1rem; width: 28px; text-align: center; }
        .stock-low { color: var(--danger); }

        .btn-delete { background: transparent; border: none; color: #bdc3c7; cursor: pointer; font-size: 1.2rem; padding: 6px; transition: 0.2s; }
        .btn-delete:hover { color: var(--danger); }

        #status-msg { margin-bottom: 15px; font-weight: 700; text-align: center; padding: 10px; border-radius: 8px; display: none; }
        .preview-img { width: 100%; height: 140px; object-fit: cover; border-radius: 10px; margin-bottom: 12px; display: none; border: 1px dashed var(--primary); }
    </style>
</head>
<body>

    <!-- CABEÇALHO -->
    <header class="header">
        <div class="header-content">
            <h1>Casa da Eliza 🍦</h1>
            <button id="btn-logout" class="btn-logout" style="display: none;" onclick="fazerLogout()">
                <i class="ph ph-sign-out"></i> Sair
            </button>
        </div>
    </header>

    <div class="container">
        
        <div id="status-msg"></div>

        <!-- TELA DE LOGIN -->
        <div id="screen-login" class="login-card">
            <h2>Painel da Eliza</h2>
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 20px;">Digite suas credenciais de administradora</p>
            
            <form id="form-login">
                <input type="email" id="login-email" placeholder="E-mail da Eliza" required>
                <input type="password" id="login-senha" placeholder="Sua senha" required>
                <button type="submit" id="btn-login-submit" class="btn-primary">
                    Entrar no Painel <i class="ph ph-arrow-right"></i>
                </button>
            </form>
        </div>

        <!-- DASHBOARD ADMIN (ESCONDIDO INICIALMENTE) -->
        <div id="screen-dashboard" class="dashboard-grid" style="display: none;">
            
            <!-- CONTROLE DE ABERTURA DA LOJA -->
            <div class="card">
                <div class="card-title">
                    <i class="ph ph-storefront" style="color: var(--primary);"></i> Status do Atendimento
                </div>
                
                <div class="store-status-options">
                    <button type="button" id="st-aberta" class="status-btn" onclick="alterarStatusLoja('aberta')">
                        <i class="ph ph-circle-wavy-check" style="font-size: 1.4rem;"></i> Aberta
                    </button>
                    <button type="button" id="st-fechada" class="status-btn" onclick="alterarStatusLoja('fechada')">
                        <i class="ph ph-x-circle" style="font-size: 1.4rem;"></i> Fechada
                    </button>
                    <button type="button" id="st-auto" class="status-btn" onclick="alterarStatusLoja('automatico')">
                        <i class="ph ph-clock" style="font-size: 1.4rem;"></i> Automático
                    </button>
                </div>

                <label for="loja-aviso">Aviso / Recado na tela do cliente:</label>
                <input type="text" id="loja-aviso" placeholder="Ex: Fechado às quartas-feiras ou Voltamos às 14h">
                <button type="button" onclick="salvarAvisoLoja()" class="btn-primary" style="padding: 10px; font-size: 0.9rem;">
                    Salvar Recado
                </button>
            </div>

            <!-- NAVEGAÇÃO ENTRE ABAS -->
            <div>
                <div class="nav-tabs">
                    <button class="tab-btn active" id="tab-produtos-btn" onclick="mudarAba('produtos')">📦 Meus Produtos</button>
                    <button class="tab-btn" id="tab-novo-btn" onclick="mudarAba('novo')">➕ Cadastrar Novo</button>
                </div>

                <!-- ABA 1: LISTA DE PRODUTOS E ESTOQUE -->
                <div id="tab-produtos" class="card">
                    <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                        <input type="text" id="search-admin" placeholder="Buscar produto no painel..." onkeyup="filtrarProdutosAdmin()" style="margin-bottom: 0;">
                    </div>

                    <div id="lista-produtos-admin">
                        <p style="text-align: center; color: var(--text-muted); padding: 20px;">Carregando produtos...</p>
                    </div>
                </div>

                <!-- ABA 2: CADASTRO DE PRODUTO -->
                <div id="tab-novo" class="card" style="display: none;">
                    <div class="card-title">Cadastrar Novo Produto</div>
                    
                    <form id="form-cadastrar-doce">
                        <label>Nome do Produto:</label>
                        <input type="text" id="p-nome" placeholder="Ex: Bolo de Pote Ninho com Nutella" required>

                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                            <div>
                                <label>Preço (R$):</label>
                                <input type="number" id="p-preco" step="0.01" placeholder="8.50" required>
                            </div>
                            <div>
                                <label>Estoque Inicial:</label>
                                <input type="number" id="p-qtd" placeholder="10" required>
                            </div>
                        </div>

                        <label>Categoria:</label>
                        <select id="p-tipo" required>
                            <option value="Marmitas">Marmitas</option>
                            <option value="Geladinho Gourmet">Geladinho Gourmet</option>
                            <option value="Bolo no pote">Bolo no pote</option>
                            <option value="Geladinho Natural">Geladinho Natural</option>
                            <option value="Doce">Doce</option>
                            <option value="Sorvete">Sorvete</option>
                        </select>

                        <div style="display: flex; gap: 20px; margin-bottom: 15px;">
                            <label style="display: flex; align-items: center; gap: 6px; cursor: pointer;">
                                <input type="checkbox" id="p-promocao" style="width: auto; margin:0;"> ★ Em Promoção
                            </label>
                            <label style="display: flex; align-items: center; gap: 6px; cursor: pointer;">
                                <input type="checkbox" id="p-novidade" style="width: auto; margin:0;"> ✨ Novidade
                            </label>
                        </div>

                        <label>Foto do Produto (Máx 3MB):</label>
                        <input type="file" id="p-foto" accept="image/png, image/jpeg, image/webp" onchange="previewImagem(this)" required>
                        <img id="img-preview" class="preview-img" alt="Preview da imagem">

                        <button type="submit" id="btn-salvar-produto" class="btn-primary">
                            <i class="ph ph-plus-circle"></i> Adicionar ao Cardápio
                        </button>
                    </form>
                </div>

            </div>

        </div>

    </div>

    <script>
        // 🔗 CONEXÃO COM O SUPABASE
        const SUPABASE_URL = "https://idnrvhldncaigjsfuagm.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlkbnJ2aGxkbmNhaWdqc2Z1YWdtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMyMTg3MzYsImV4cCI6MjEwODc5NDczNn0.eZMfvc6KFHGKOkSce06xP3U8JM9_VklQqX73Jxosdmw";

        let tokenDeAcesso = sessionStorage.getItem('eliza_token') || "";
        let listaProdutosGlobal = [];
        let estadoLojaGlobal = null;

        // --- INICIALIZAÇÃO ---
        window.addEventListener('DOMContentLoaded', () => {
            if (tokenDeAcesso) {
                mostrarDashboard();
            }
        });

        function exibirMensagem(texto, tipo = 'sucesso') {
            const statusDiv = document.getElementById('status-msg');
            statusDiv.innerText = texto;
            statusDiv.style.display = 'block';
            statusDiv.style.background = tipo === 'sucesso' ? '#e8f8f0' : '#fdeaea';
            statusDiv.style.color = tipo === 'sucesso' ? '#1e8449' : '#922b21';
            statusDiv.style.border = `1px solid ${tipo === 'sucesso' ? '#2ecc71' : '#e74c3c'}`;
            setTimeout(() => { statusDiv.style.display = 'none'; }, 4000);
        }

        // --- LOGIN ---
        document.getElementById('form-login').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-login-submit');
            btn.innerText = "Autenticando...";

            try {
                const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
                    method: 'POST',
                    headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: document.getElementById('login-email').value,
                        password: document.getElementById('login-senha').value
                    })
                });

                const data = await res.json();
                if (!res.ok) throw new Error(data.error_description || "Login falhou");

                tokenDeAcesso = data.access_token;
                sessionStorage.setItem('eliza_token', tokenDeAcesso);
                mostrarDashboard();
                exibirMensagem("Bem-vinda, Eliza! Login realizado.");

            } catch (erro) {
                exibirMensagem("E-mail ou senha incorretos.", "erro");
                btn.innerHTML = 'Entrar no Painel <i class="ph ph-arrow-right"></i>';
            }
        });

        function fazerLogout() {
            sessionStorage.removeItem('eliza_token');
            tokenDeAcesso = "";
            document.getElementById('screen-dashboard').style.display = 'none';
            document.getElementById('btn-logout').style.display = 'none';
            document.getElementById('screen-login').style.display = 'block';
        }

        function mostrarDashboard() {
            document.getElementById('screen-login').style.display = 'none';
            document.getElementById('screen-dashboard').style.display = 'grid';
            document.getElementById('btn-logout').style.display = 'flex';
            carregarStatusLoja();
            carregarProdutosAdmin();
        }

        // --- LOJA STATUS ---
        async function carregarStatusLoja() {
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/loja?id=eq.1`, {
                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${tokenDeAcesso}` }
                });
                const dados = await res.json();
                if (dados && dados.length > 0) {
                    estadoLojaGlobal = dados[0];
                    atualizarBotoesStatus(estadoLojaGlobal.abertura_manual);
                    document.getElementById('loja-aviso').value = estadoLojaGlobal.aviso || "";
                }
            } catch (err) {
                console.error("Erro ao carregar status da loja", err);
            }
        }

        function atualizarBotoesStatus(modo) {
            document.getElementById('st-aberta').className = `status-btn ${modo === 'aberta' ? 'active-open' : ''}`;
            document.getElementById('st-fechada').className = `status-btn ${modo === 'fechada' ? 'active-closed' : ''}`;
            document.getElementById('st-auto').className = `status-btn ${modo === 'automatico' ? 'active-auto' : ''}`;
        }

        async function alterarStatusLoja(novoModo) {
            atualizarBotoesStatus(novoModo);
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/loja?id=eq.1`, {
                    method: 'PATCH',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${tokenDeAcesso}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ abertura_manual: novoModo })
                });
                if (res.ok) exibirMensagem("Status da loja atualizado!");
            } catch (err) {
                exibirMensagem("Erro ao atualizar status", "erro");
            }
        }

        async function salvarAvisoLoja() {
            const avisoTexto = document.getElementById('loja-aviso').value;
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/loja?id=eq.1`, {
                    method: 'PATCH',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${tokenDeAcesso}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ aviso: avisoTexto })
                });
                if (res.ok) exibirMensagem("Aviso da loja salvo!");
            } catch (err) {
                exibirMensagem("Erro ao salvar aviso", "erro");
            }
        }

        // --- PRODUTOS & ESTOQUE ---
        async function carregarProdutosAdmin() {
            const container = document.getElementById('lista-produtos-admin');
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/produtos?select=*&order=id.desc`, {
                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${tokenDeAcesso}` }
                });
                listaProdutosGlobal = await res.json();
                renderizarProdutosAdmin(listaProdutosGlobal);
            } catch (err) {
                container.innerHTML = `<p style="color:var(--danger); text-align:center;">Erro ao carregar produtos.</p>`;
            }
        }

        function renderizarProdutosAdmin(lista) {
            const container = document.getElementById('lista-produtos-admin');
            if (lista.length === 0) {
                container.innerHTML = `<p style="text-align:center; color:var(--text-muted); padding:20px;">Nenhum produto cadastrado.</p>`;
                return;
            }

            container.innerHTML = lista.map(item => `
                <div class="product-item">
                    <img src="${item.imagem || '/assets/logo-casa-da-eliza.png'}" class="product-thumb" alt="${item.nome}">
                    <div class="product-details">
                        <h4>${item.nome}</h4>
                        <div style="font-weight: 700; color: var(--secondary); font-size: 0.9rem;">
                            R$ ${parseFloat(item.preco).toFixed(2).replace('.', ',')}
                        </div>
                        <span class="type-badge">${item.tipo}</span>
                    </div>

                    <div class="stock-control">
                        <button type="button" class="stock-btn" onclick="alterarEstoque(${item.id}, ${item.quantidade - 1})">-</button>
                        <span class="stock-value ${item.quantidade <= 5 ? 'stock-low' : ''}">${item.quantidade}</span>
                        <button type="button" class="stock-btn" onclick="alterarEstoque(${item.id}, ${item.quantidade + 1})">+</button>
                    </div>

                    <button type="button" class="btn-delete" title="Excluir produto" onclick="deletarProduto(${item.id}, '${item.nome}')">
                        <i class="ph ph-trash"></i>
                    </button>
                </div>
            `).join('');
        }

        async function alterarEstoque(id, novaQtd) {
            if (novaQtd < 0) return;
            
            // Atualização Otimista na Interface
            const prod = listaProdutosGlobal.find(p => p.id === id);
            if (prod) prod.quantidade = novaQtd;
            renderizarProdutosAdmin(listaProdutosGlobal);

            try {
                await fetch(`${SUPABASE_URL}/rest/v1/produtos?id=eq.${id}`, {
                    method: 'PATCH',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${tokenDeAcesso}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ quantidade: novaQtd })
                });
            } catch (err) {
                carregarProdutosAdmin();
            }
        }

        async function deletarProduto(id, nome) {
            if (!confirm(`Tem certeza que deseja apagar "${nome}" do cardápio?`)) return;

            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/produtos?id=eq.${id}`, {
                    method: 'DELETE',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${tokenDeAcesso}`
                    }
                });

                if (res.ok) {
                    exibirMensagem(`Produto "${nome}" removido.`);
                    carregarProdutosAdmin();
                }
            } catch (err) {
                exibirMensagem("Erro ao excluir produto", "erro");
            }
        }

        function filtrarProdutosAdmin() {
            const termo = document.getElementById('search-admin').value.toLowerCase();
            const filtrados = listaProdutosGlobal.filter(p => p.nome.toLowerCase().includes(termo) || p.tipo.toLowerCase().includes(termo));
            renderizarProdutosAdmin(filtrados);
        }

        // --- CADASTRO DE NOVO PRODUTO ---
        function previewImagem(input) {
            const preview = document.getElementById('img-preview');
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        document.getElementById('form-cadastrar-doce').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-salvar-produto');
            btn.disabled = true;
            btn.innerText = "1/2: Enviando foto...";

            const fotoFile = document.getElementById('p-foto').files[0];
            const extensao = fotoFile.name.split('.').pop();
            const nomeFotoUnico = `item_${Date.now()}.${extensao}`;

            try {
                // A. Upload da Imagem
                const uploadRes = await fetch(`${SUPABASE_URL}/storage/v1/object/fotos-eliza/${nomeFotoUnico}`, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${tokenDeAcesso}`,
                        'Content-Type': fotoFile.type
                    },
                    body: fotoFile
                });

                if (!uploadRes.ok) throw new Error("Erro no upload da foto");

                const urlImagem = `${SUPABASE_URL}/storage/v1/object/public/fotos-eliza/${nomeFotoUnico}`;

                // B. Cadastro no Banco
                btn.innerText = "2/2: Salvando produto...";

                const novoProduto = {
                    nome: document.getElementById('p-nome').value,
                    preco: parseFloat(document.getElementById('p-preco').value),
                    quantidade: parseInt(document.getElementById('p-qtd').value),
                    tipo: document.getElementById('p-tipo').value,
                    promocao: document.getElementById('p-promocao').checked,
                    novidade: document.getElementById('p-novidade').checked,
                    imagem: urlImagem
                };

                const dbRes = await fetch(`${SUPABASE_URL}/rest/v1/produtos`, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${tokenDeAcesso}`,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=minimal'
                    },
                    body: JSON.stringify(novoProduto)
                });

                if (!dbRes.ok) throw new Error("Erro ao salvar produto no banco");

                exibirMensagem("🎉 Produto adicionado ao cardápio com sucesso!");
                document.getElementById('form-cadastrar-doce').reset();
                document.getElementById('img-preview').style.display = 'none';
                
                mudarAba('produtos');
                carregarProdutosAdmin();

            } catch (err) {
                exibirMensagem("Falha ao salvar. Verifique se a foto tem menos de 3MB.", "erro");
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="ph ph-plus-circle"></i> Adicionar ao Cardápio';
            }
        });

        // --- NAVEGAÇÃO DE ABAS ---
        function mudarAba(aba) {
            document.getElementById('tab-produtos').style.display = aba === 'produtos' ? 'block' : 'none';
            document.getElementById('tab-novo').style.display = aba === 'novo' ? 'block' : 'none';
            
            document.getElementById('tab-produtos-btn').className = `tab-btn ${aba === 'produtos' ? 'active' : ''}`;
            document.getElementById('tab-novo-btn').className = `tab-btn ${aba === 'novo' ? 'active' : ''}`;
        }
    </script>
</body>
</html>
